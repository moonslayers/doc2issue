name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install pymupdf mammoth python-docx python-pptx pandas openpyxl pytest

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
